[package]
name = "gomessages"
version = "0.3.0"
edition = "2021"
description = "GoMessages — native Google Messages desktop client"
license = "MIT"


[dependencies]
anyhow = "1"
directories = "6"
url = "2"
webbrowser = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.57.0"
winit = "0.30"
muda = "0.21.0"
http = "1.5.0"
tray-icon = "0.26"

# Native prototype track (egui UI + OAuth + store). Off by default so the
# product binary builds fast; CI still lints it. Enable with --features native.
eframe = { version = "0.36", optional = true, features = ["default"] }
egui = { version = "0.36", optional = true }
rand = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "2", optional = true, features = ["json"] }
chrono = { version = "0.4", optional = true }

# macOS: Dock icon policy, Dock badge, Dock-click reopen (see platform.rs).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSGraphics",
  "NSSound",
  "NSDockTile",
  "NSResponder",
  "NSRunningApplication",
] }

# Linux: GTK must be initialized and pumped for wry webviews and the tray.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Probe for AppIndicator before tray-icon touches it (it panics if missing).
libloading = "0.8"

[features]
default = []
native = [
  "dep:eframe",
  "dep:egui",
  "dep:rand",
  "dep:base64",
  "dep:sha2",
  "dep:ureq",
  "dep:chrono",
]
