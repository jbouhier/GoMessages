name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + test (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/frontend/package.json
      - uses: extractions/setup-just@v4
      - name: Chrome for the UI tests
        run: cd frontend && bun install --frozen-lockfile && bunx playwright-core install chromium
      - run: just lint
      - run: just test

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/frontend/package.json
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: UI
        run: cd frontend && bun install --frozen-lockfile && bun run build
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ ./...
      - name: GTK 3 build tag
        if: runner.os == 'Linux'
        run: go vet -tags gtk3 ./...
