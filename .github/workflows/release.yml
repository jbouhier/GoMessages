name: Release

on:
  push:
    tags: ["v*"]

env:
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

jobs:
  gate:
    name: lint + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - uses: extractions/setup-just@v4
      - name: Chrome for the UI tests
        run: cd frontend && bun install --frozen-lockfile && bunx playwright-core install chromium
      - run: just lint
      - run: just test

  build:
    name: release (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: GoMessages-macos-aarch64.dmg
          - os: windows-latest
            artifact: GoMessages-windows-x86_64.zip
          - os: ubuntu-24.04
            artifact: GoMessages-linux-x86_64.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Wails CLI (version from go.mod)
        run: |
          version="$(awk '$1 == "github.com/wailsapp/wails/v3" { print $2; exit }' go.mod)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 package
          mkdir -p dist
          ditto bin/gomessages.app dist/GoMessages.app
          # Ad-hoc signed by wails3 package, so Gatekeeper shows a bypassable
          # warning instead of "damaged". Real fix: Developer ID + notarize.
          codesign --verify --deep --strict dist/GoMessages.app
          hdiutil create -volname GoMessages -srcfolder dist/GoMessages.app -ov -format UDZO "dist/${{ matrix.artifact }}"

      # Optional Developer-ID sign + notarize. No-op without secrets.
      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -o '".*"' | head -n 1 | tr -d '"')
          codesign --deep --force --sign "$IDENTITY" --options runtime dist/GoMessages.app
          ditto -c -k --keepParent dist/GoMessages.app /tmp/GoMessages.zip
          xcrun notarytool submit /tmp/GoMessages.zip \
            --key <(echo "$APPLE_API_KEY" | base64 --decode) \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple dist/GoMessages.app
          hdiutil create -volname GoMessages -srcfolder dist/GoMessages.app -ov -format UDZO "dist/${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          wails3 build
          mkdir -p dist
          cp bin/gomessages.exe dist/GoMessages.exe
          pwsh -Command "Compress-Archive -Path dist/GoMessages.exe -DestinationPath 'dist/${{ matrix.artifact }}'"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 build
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}" -C bin gomessages

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.artifact }}
          body_path: release-notes.md
