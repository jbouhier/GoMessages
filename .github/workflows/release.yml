name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features native -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features native

  build:
    name: release (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: GoMessages-macos-aarch64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: GoMessages-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: GoMessages-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --bin gomessages

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle.sh target/release/gomessages
          # Ad-hoc sign so Gatekeeper shows a bypassable warning instead of
          # an unbypassable "damaged" error. Real fix: Developer ID + notarize.
          codesign --force --deep --sign - dist/GoMessages.app
          hdiutil create -volname GoMessages \
            -srcfolder "dist/GoMessages.app" -ov -format UDZO \
            "dist/${{ matrix.artifact }}"

      # Optional Developer-ID sign + notarize. No-op without secrets (see README).
      - name: Sign + notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -o '".*"' | head -n 1 | tr -d '"')
          codesign --deep --force --sign "$IDENTITY" --options runtime "dist/GoMessages.app"
          ditto -c -k --keepParent "dist/GoMessages.app" /tmp/GoMessages.zip
          xcrun notarytool submit /tmp/GoMessages.zip \
            --key <(echo "$APPLE_API_KEY" | base64 --decode) \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "dist/GoMessages.app"
          hdiutil create -volname GoMessages \
            -srcfolder "dist/GoMessages.app" -ov -format UDZO \
            "dist/${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/release/gomessages.exe -DestinationPath "dist/${{ matrix.artifact }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}" -C target/release gomessages

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
